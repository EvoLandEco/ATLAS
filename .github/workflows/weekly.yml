name: Wednesday outbreak briefing
on:
  schedule:
    - cron: '37 8 * * 3'
      timezone: Europe/Amsterdam
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: epiweekly-state-writer
  cancel-in-progress: false
jobs:
  weekly:
    if: vars.EPIWEEKLY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private state location
        env:
          EPIWEEKLY_STATE_REPO: ${{ vars.EPIWEEKLY_STATE_REPO }}
          EPIWEEKLY_STATE_TOKEN: ${{ secrets.EPIWEEKLY_STATE_TOKEN }}
        run: python scripts/check_state_repo.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.EPIWEEKLY_STATE_REPO }}
          token: ${{ secrets.EPIWEEKLY_STATE_TOKEN }}
          path: .runtime-state
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Collect, prepare review, and seal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EPIWEEKLY_PROVIDER: ${{ vars.EPIWEEKLY_PROVIDER || 'none' }}
          EPIWEEKLY_MODEL: ${{ vars.EPIWEEKLY_MODEL }}
        run: |
          case "$EPIWEEKLY_PROVIDER" in
            none|openai) ;;
            *) echo "Hosted collection supports none or openai; use codex on a signed-in local machine." >&2; exit 1 ;;
          esac
          epiweekly verify
          epiweekly run > .runtime-state/last-run.json
      - name: Persist captured state
        if: always()
        working-directory: .runtime-state
        run: |
          test -d .git || exit 1
          printf '\n.writer.lock\n*.tmp\n' >> .git/info/exclude
          git config user.name "EpiWeekly workflow"
          git config user.email "epiweekly@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Record Wednesday outbreak workflow state"
            git push
          fi
      - name: Report receipt
        env:
          EPIWEEKLY_STATE_REPO: ${{ vars.EPIWEEKLY_STATE_REPO }}
        run: |
          python scripts/run_summary.py >> "$GITHUB_STEP_SUMMARY"
