name: Validate workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest -q
          node tests/test_map_links.cjs
          node tests/test_site_view.cjs
          atlas schemas --out generated-schemas
          diff -r schemas generated-schemas
          atlas demo --out demo-output
          atlas replay demo-output/reports/2026-09-23/report.json --out replay-output
          cmp demo-output/reports/2026-09-23/dataset.zip replay-output/dataset.zip
