name: Publish approved dataset
on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: Relative bundle directory in private state
        required: true
        type: string
      approval_path:
        description: Relative approval JSON in private state
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    environment: outbreak-publication
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify private state location
        env:
          ATLAS_STATE_REPO: ${{ vars.ATLAS_STATE_REPO }}
          ATLAS_STATE_TOKEN: ${{ secrets.ATLAS_STATE_TOKEN }}
        run: python scripts/check_state_repo.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ vars.ATLAS_STATE_REPO }}
          token: ${{ secrets.ATLAS_STATE_TOKEN }}
          path: .runtime-state
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Stage verified approved files
        id: stage
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
        run: python scripts/stage_approved.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" approved-release/dataset.zip approved-release/approval.json \
            --title "ATLAS $RELEASE_TAG" --notes-file approved-release/RELEASE.md
