timezone: Europe/Amsterdam
dataset_mode: operational
user_agent: "ATLAS/0.1.0-alpha.18 (research-group weekly intelligence)"
event_stale_days: 21
publication_window_days: 14
limits:
  max_response_bytes: 16000000
  request_interval_seconds: 1.0
  max_index_pages: 40
  max_documents_per_source: 2000
  revisit_documents: 8
  chunk_characters: 28000
  chunk_overlap: 1200
  max_model_calls: 36
  max_input_characters: 650000
  max_output_tokens: 10000
  codex_timeout_seconds: 1200
  codex_output_bytes: 1000000
research_profile:
  name: One Health transmission, inference, and prevention
  weights:
    temporal_networks: 5
    one_health: 5
    spatiotemporal_networks: 4
    inference: 4
    phylodynamics: 4
    observation_process: 4
    reproducible_analysis: 3
    data_call: 3
sources:
  - id: who_don
    name: WHO Disease Outbreak News
    role: official_international_reporting
    adapter: who_odata
    enabled: true
    required: true
    priority: 1
    allowed_hosts: [www.who.int]
    index_url: https://www.who.int/api/news/diseaseoutbreaknews
  - id: ecdc_cdtr
    name: ECDC Communicable Disease Threats Reports
    role: official_regional_synthesis
    adapter: html_index
    enabled: true
    required: true
    priority: 2
    allowed_hosts: [www.ecdc.europa.eu, ecdc.europa.eu]
    index_url: https://www.ecdc.europa.eu/en/publications-and-data/monitoring/weekly-threats-reports
    row_selector: article.ct-publication
    entry_link_selector: .ecdc-card__title a[href]
    date_selector: time[datetime]
    date_order: descending
    next_selector: a[rel=next]
    link_pattern: /en/publications-data/communicable-disease-threats-report
    pdf_card_selector: .ecdc-file-download
    primary_pdf: 'communicable disease threats report'
    exclude_pdf: 'maps|graphs|visualisation|visualization'
  - id: efsa
    name: European Food Safety Authority
    role: official_one_health_context_and_calls
    adapter: html_index
    enabled: true
    required: false
    priority: 3
    allowed_hosts: [www.efsa.europa.eu, efsa.europa.eu, efsa.onlinelibrary.wiley.com]
    row_selector: article.scientific-output
    entry_link_selector: .card-title a[href]
    date_selector: .field-published-date time[datetime]
    date_order: descending
    next_selector: a[aria-label=Next]
    link_pattern: /en/|/doi/
    indexes:
      - index_url: https://www.efsa.europa.eu/en/publications?topic%5B389%5D=389
      - index_url: https://www.efsa.europa.eu/en/publications?topic%5B357%5D=357
      - index_url: https://www.efsa.europa.eu/en/news?topic%5B389%5D=389
        row_selector: .efsa-landing-pages.newsroom article
      - index_url: https://www.efsa.europa.eu/en/news?topic%5B357%5D=357
        row_selector: .efsa-landing-pages.newsroom article
      - index_url: https://www.efsa.europa.eu/en/calls/data
        row_selector: .calls-for-data article
        date_order: null
        topic_selector: main .field-topics a[href]
        topic_urls:
          - https://www.efsa.europa.eu/en/topics/topic/animal-health
          - https://www.efsa.europa.eu/en/topics/topic/biological-hazards
  - id: fao_aiv
    name: FAO global avian influenza situation updates
    role: official_animal_health_synthesis
    adapter: static
    enabled: true
    required: false
    priority: 3
    allowed_hosts: [www.fao.org, fao.org]
    content_selector: "#Contentplaceholder1_C016_Col00"
    publication_date_selector: "#Contentplaceholder1_C016_Col00 > div:first-child strong"
    publication_date_format: "%d %B %Y"
    urls:
      - https://www.fao.org/animal-health/situation-updates/global-aiv-with-zoonotic-potential
  - id: rivm
    name: RIVM news
    role: official_national_context
    adapter: sitemap
    enabled: true
    required: false
    priority: 1
    publication_date_selector: .content-date-created
    publication_date_format: "Publicatiedatum %d-%m-%Y | %H:%M"
    allowed_hosts: [www.rivm.nl, rivm.nl]
    index_url: https://www.rivm.nl/sitemap.xml
    link_pattern: ^https://www\.rivm\.nl/nieuws/(?!rss\.xml$)
  - id: woah_wahis
    name: WOAH WAHIS (possible source; collaboration not established)
    role: official_animal_health_notifications
    adapter: manual
    enabled: false
    required: false
    priority: 1
    allowed_hosts: [www.woah.org, wahis.woah.org]
  - id: beacon
    name: BEACON (possible source; collaboration not established)
    role: curated_signal_discovery
    adapter: manual
    enabled: false
    required: false
    priority: 5
    allowed_hosts: [beaconbio.org, www.beaconbio.org]

  - id: who_afro
    name: WHO Africa outbreak and emergency bulletins
    role: official_regional_synthesis
    adapter: html_index
    enabled: true
    required: false
    priority: 2
    allowed_hosts: [www.afro.who.int, iris.who.int]
    index_url: https://www.afro.who.int/health-topics/disease-outbreaks/outbreaks-and-other-emergencies-updates
    row_selector: article.ob-latest, .ob-previous article
    entry_link_selector: .pub-list-title a[href]
    date_selector: .pub-card-date
    date_format: "%d %B %Y"
    date_order: descending
    next_selector: a[aria-label="Next page"]
    link_pattern: weekly-bulletin
    attachment_selector: a.btn-pub-iris, a[href$=".pdf"]
  - id: ncdc_sitreps
    name: Nigeria NCDC disease situation reports
    role: official_national_reporting
    adapter: ncdc_sitreps
    max_index_pages: 20
    enabled: true
    required: false
    priority: 2
    allowed_hosts: [ncdc.gov.ng]
    index_url: https://ncdc.gov.ng/diseases/sitreps
  - id: paho_alerts
    name: PAHO epidemiological alerts and updates
    role: official_regional_synthesis
    adapter: html_index
    enabled: true
    required: false
    priority: 2
    allowed_hosts: [www.paho.org]
    index_url: https://www.paho.org/en/epidemiological-alerts-and-updates
    row_selector: .views-view-grid .col
    entry_link_selector: .views-field-title a[href]
    date_selector: time[datetime]
    next_selector: a[rel=next]
    link_pattern: /en/documents/
    date_order: descending
    attachment_selector: .download-button a[href]

  - id: who_sitreps
    name: WHO emergency situation updates
    role: official_international_synthesis
    adapter: who_sitreps
    enabled: true
    required: false
    priority: 2
    allowed_hosts: [www.who.int, cdn.who.int, iris.who.int]
    index_url: https://www.who.int/api/hubs/meetingreports
    publication_base: https://www.who.int/publications/m/item/
    query:
      sf_provider: OpenAccessProvider
      sf_culture: en
      $orderby: PublicationDateAndTime desc
      $filter: "meetingreporttypes/any(a:a eq ce6cf3c6-43fc-49bf-9c4c-71bd965ee047)"

  - id: ukhsa_monitoring
    name: UKHSA global outbreaks under monitoring
    role: official_national_synthesis
    adapter: html_index
    enabled: true
    required: false
    priority: 2
    allowed_hosts: [www.gov.uk]
    index_url: https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026
    row_selector: section.gem-c-attachment
    entry_link_selector: .gem-c-attachment__title a[href]
    date_selector: time[datetime]
    next_selector: a[rel=next]
    link_pattern: /outbreaks-under-monitoring-week-
    content_selector: main .govspeak
